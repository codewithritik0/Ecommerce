<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
            crossorigin="anonymous"
        />

        <script
            src="https://kit.fontawesome.com/0d339be604.js"
            crossorigin="anonymous"
        ></script>

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <header>
            <input type="checkbox" name="" id="toggler" />

            <label for="toggler" class="fas fa-bars"></label>

            <a href="index.html" class="logo">Store <span>.</span></a>
            <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="products.html">Products</a>
                <a href="contact.html">contact</a>
            </nav>

            <nav class="icons">
                <a href="cart.html"
                    ><i class="fa-solid fa-cart-shopping"></i>
                </a>
            </nav>
        </header>

        <!-- checkout section -->

        <section class="my-5 py-5 checkout">
            <div class="container text-center mt-5 pt-5">
                <h2 class="font-weight-bold">Check Out</h2>
                <hr class="mx-auto" />
            </div>

            <div class="mx-auto container">
                <form id="checkout-form">
                    <div class="form-group checkout-small-element">
                        <label for="">Name</label>
                        <input
                            type="text"
                            class="form-control"
                            id="checkout-name"
                            name="name"
                            placeholder="name"
                            required
                        />
                    </div>

                    <div class="form-group checkout-small-element">
                        <label for="">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="checkout-name"
                            name="email"
                            placeholder="email address"
                            required
                        />
                    </div>

                    <div class="form-group checkout-small-element">
                        <label for="">Phone</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="checkout-phone"
                            name="phone"
                            placeholder="phone number"
                            required
                        />
                    </div>

                    <div class="form-group checkout-small-element">
                        <label for="">City</label>
                        <input
                            type="text"
                            class="form-control"
                            id="checkout-city"
                            name="city"
                            placeholder="city"
                            required
                        />
                    </div>

                    <div class="form-group checkout-large-element">
                        <label for="">Address</label>
                        <input
                            type="text"
                            class="form-control"
                            id="checkout-address"
                            name="address"
                            placeholder="address"
                            required
                        />
                    </div>

                    <div class="form-group checkout-btn-container">
                        <label for="">total amount $84</label>
                        <input
                            type="submit"
                            class="btn"
                            id="checkout-btn"
                            name="checkout-btn"
                            value="Checkout"
                            required
                        />
                    </div>
                </form>
            </div>
        </section>

        <!-- footer section -->

        <section class="footer">
            <div class="box-container">
                <div class="box">
                    <h3>quicks links</h3>
                    <a href="index.html">Home</a>
                    <a href="about.html">About</a>
                    <a href="products.html">Products</a>
                    <a href="index.html#review">Review</a>
                    <a href="contact.html">contact</a>
                </div>

                <div class="box">
                    <h3>extra links</h3>
                    <a href="cart.html">cart</a>
                    <a href="products.html">products</a>
                    <a href="#">special offers</a>
                </div>

                <div class="box">
                    <h3>Location</h3>
                    <p>India</p>
                    <p>Japan</p>
                    <p>New York</p>
                </div>

                <div class="box">
                    <h3>Contact Info</h3>
                    <p>+123 456 7890</p>
                    <p>info@email.com</p>
                </div>
            </div>

            <div class="credit">
                created by <span>NOBODY</span>| all right reserved to nobody
            </div>
        </section>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
