<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bootstrap Example</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <i class="fa fa-refresh" aria-hidden="true"></i>
        <div class="container-fluid mt-3">
            <h1>Responsive Columns</h1>
            <p>Resize the browser window to see the effect.</p>
            <p>
                The columns will automatically stack on top of each other when
                the screen is less than 576px wide.
            </p>
            <div class="row">
                <div class="col-sm-4 p-3 bg-primary text-white">.col</div>
                <div class="col-sm-4 p-3 bg-dark text-white">.col</div>
                <div class="col-sm-4 p-3 bg-primary text-white">.col</div>
            </div>
        </div>

        <ul class="list-group">
            <li class="list-group-item">Active item</li>
            <li class="list-group-item active">Second item</li>
            <li class="list-group-item">Third item</li>
        </ul>
    </body>
</html>
